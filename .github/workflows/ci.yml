name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  GOTOOLCHAIN: local

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: internal/webui/dist/
          include-hidden-files: true
          retention-days: 7

  go:
    name: Go vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go vet (linux/arm)
        if: runner.os == 'Linux'
        run: GOOS=linux GOARCH=arm GOARM=7 go vet ./...
      - run: go test ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build ${{ matrix.name }}
    needs: [web, go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: linux-amd64, goarch: amd64, goarm: "" }
          - { name: linux-arm64, goarch: arm64, goarm: "" }
          - { name: linux-armv7, goarch: arm, goarm: "7" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: internal/webui/dist/
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          pkg=github.com/hustenreizjuengling/picache/internal/version
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath \
            -ldflags "-s -w -X $pkg.Version=${GITHUB_SHA::12} -X $pkg.Commit=${GITHUB_SHA::12} -X $pkg.Date=$date" \
            -o "bin/picache-${{ matrix.name }}" ./cmd/picache
          cp LICENSE THIRD_PARTY_NOTICES.md bin/
      - uses: actions/upload-artifact@v7
        with:
          name: picache-${{ matrix.name }}
          path: |
            bin/picache-${{ matrix.name }}
            bin/LICENSE
            bin/THIRD_PARTY_NOTICES.md
          retention-days: 7

  deploy:
    name: Deploy artefacts
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          sh -n deploy/install.sh
          sh -n scripts/test-install.sh
          shellcheck -s sh deploy/install.sh scripts/test-install.sh
      - name: Validate compose files
        run: |
          docker compose -f deploy/docker/docker-compose.yml config -q
          docker compose -f deploy/docker/docker-compose.bridge.yml config -q
      - uses: actions/download-artifact@v8
        with:
          name: picache-linux-amd64
          path: bin/
      - name: Installer smoke test
        run: sh scripts/test-install.sh bin/picache-linux-amd64

  docker:
    name: Docker image
    needs: [web, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
