name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  GOTOOLCHAIN: local

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: internal/webui/dist/
          include-hidden-files: true
          retention-days: 7

  go:
    name: Go vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go vet (linux/arm, arm GOARM=6, 386, riscv64)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=arm GOARM=7 go vet ./...
          GOOS=linux GOARCH=arm GOARM=6 go vet ./...
          GOOS=linux GOARCH=386 go vet ./...
          GOOS=linux GOARCH=riscv64 go vet ./...
      - run: go test ./...
      # 32-bit: the tests run natively on the amd64 runner.
      - name: go test (linux/386)
        if: runner.os == 'Linux'
        run: GOARCH=386 go test ./...

  # The query path (DNS server, upstreams, DNSSEC validation) and the
  # network building blocks under the race detector (it needs cgo).
  race:
    name: Go race detector (DNS, netutil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/dns/... ./internal/netutil/...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build ${{ matrix.name }}
    needs: [web, go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: linux-amd64, goarch: amd64, goarm: "" }
          - { name: linux-arm64, goarch: arm64, goarm: "" }
          - { name: linux-armv7, goarch: arm, goarm: "7" }
          - { name: linux-armv6, goarch: arm, goarm: "6" }
          - { name: linux-386, goarch: "386", goarm: "" }
          - { name: linux-riscv64, goarch: riscv64, goarm: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: internal/webui/dist/
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GO386: sse2
        run: |
          pkg=github.com/hustenreizjuengling/picache/internal/version
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath \
            -ldflags "-s -w -X $pkg.Version=${GITHUB_SHA::12} -X $pkg.Commit=${GITHUB_SHA::12} -X $pkg.Date=$date" \
            -o "bin/picache-${{ matrix.name }}" ./cmd/picache
          cp LICENSE THIRD_PARTY_NOTICES.md bin/
      - uses: actions/upload-artifact@v7
        with:
          name: picache-${{ matrix.name }}
          path: |
            bin/picache-${{ matrix.name }}
            bin/LICENSE
            bin/THIRD_PARTY_NOTICES.md
          retention-days: 7

  deploy:
    name: Deploy artefacts (${{ matrix.image }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "fedora:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          for f in deploy/install.sh scripts/*.sh; do sh -n "$f"; done
          shellcheck -s sh deploy/install.sh scripts/*.sh
          # The fragments of the maintainer scripts use install.sh's
          # functions and variables and override some of its constants.
          shellcheck -s sh -e SC2154 -e SC2034 deploy/debian/*.sh
      - name: Validate compose files
        run: |
          for f in deploy/docker/docker-compose.yml deploy/docker/docker-compose.bridge.yml \
              deploy/docker/docker-compose.macvlan.yml deploy/truenas/docker-compose.yml deploy/synology/docker-compose.yml; do
            docker compose -f "$f" config -q
          done
      - uses: actions/download-artifact@v8
        with:
          name: picache-linux-amd64
          path: bin/
      - name: Installer test
        run: sh scripts/test-install.sh bin/picache-linux-amd64 "${{ matrix.image }}"

  dist:
    name: Release assets (make dist)
    needs: [web, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: make dist refuses versions that are not SemVer with a v prefix
        run: |
          for v in "" 1.2.3 v1.2 v01.2.3 v1.2.3-rc.01 v1.2.3+build "v1.2.3 x"; do
            if make dist VERSION="$v" >/dev/null 2>&1; then
              echo "make dist accepted VERSION=\"$v\""; exit 1
            fi
          done
      - name: make dist refuses a pre-release with a hyphen (Debian versions)
        run: |
          if make dist VERSION=v1.2.3-beta-2 >/dev/null 2>&1; then
            echo "make dist accepted VERSION=v1.2.3-beta-2"; exit 1
          fi
      - name: make dist
        run: make dist VERSION=v0.0.0-ci
      - name: Check the assets
        run: |
          sh scripts/check-dist.sh dist v0.0.0-ci
          ./dist/picache-linux-amd64 version | grep -q '^picache v0\.0\.0-ci '
          tar -tzf dist/picache-deploy.tar.gz | grep -qx deploy/install.sh
          cmp dist/get-picache.sh scripts/get-picache.sh
      - name: get-picache.sh unit test
        run: sh scripts/test-get-picache.sh
      - name: Debian package test (debian:13)
        run: sh scripts/test-deb.sh dist debian:13
      - name: Debian package test (debian:12)
        run: sh scripts/test-deb.sh dist debian:12
      - name: Release notes script
        run: |
          latest=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          sh scripts/release-notes.sh "v$latest" > /dev/null

  docker:
    name: Docker image
    needs: [web, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The platforms of gcr.io/distroless/static-debian13 that PiCache
      # builds for (release.yml; no arm/v6 and no 386 there).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

  # The best-effort architectures under QEMU: the binary starts and the
  # tests of the privilege and capability drops pass (not tested on
  # hardware; a failure here does not fail CI). On riscv64 and arm/v6,
  # QEMU's own threads (user-mode emulation) keep CAP_NET_RAW, so
  # TestDropNetRaw's check that no thread of the process holds it after the
  # drop cannot pass there; it is skipped on those two.
  emulated:
    name: Emulated ${{ matrix.platform }}
    needs: [go]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/386, linux/riscv64, linux/arm/v6]
        include:
          - platform: linux/riscv64
            skip: TestDropNetRaw
          - platform: linux/arm/v6
            skip: TestDropNetRaw
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - name: picache version and the app and netutil tests
        env:
          SKIP: ${{ matrix.skip }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" -v "$PWD:/src" -w /src \
            -e CGO_ENABLED=0 -e GOTOOLCHAIN=local -e SKIP golang:1.27-alpine sh -c \
            'go build -o /tmp/picache ./cmd/picache && /tmp/picache version && go test ${SKIP:+-skip "$SKIP"} ./internal/app/... ./internal/netutil/...'
